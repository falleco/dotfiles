onboarding = false

[keys]
prefix = "alt+a"
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+minus"
split_vertical    = "prefix+slash"
new_tab   = "prefix+c"
close_tab = "prefix+ampersand"
workspace_picker = "prefix+w"
goto             = "prefix+g"
copy_mode  = "prefix+y"  # herdr's copy-mode entry key; copy-mode's own internal keys (v/space select, y/Enter copy, q/Esc cancel) aren't configurable

[ui]
# Agents panel order: explicit choice of "spaces" (grouped by space, the default) over "priority".
agent_panel_sort = "spaces"

[[keys.command]]
key = "prefix+e"
type = "shell"
command = '''
response="$("$HERDR_BIN_PATH" plugin pane open --plugin herdr-sidebar --entrypoint sidebar --placement tab --focus)"
tab_id="$(printf '%s\n' "$response" | jq -r '.result.plugin_pane.pane.tab_id // empty')"
if [ -n "$tab_id" ]; then
  "$HERDR_BIN_PATH" tab rename "$tab_id" files
fi
'''
description = "Open files tab"

[[keys.command]]
key = "ctrl+shift+a"
type = "plugin_action"
command = "termscope.open"
description = "visible-screen file picker"

[[keys.command]]
key = "ctrl+e"
type = "plugin_action"
command = "termscope.open-links"
description = "visible-screen link picker"